<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" />
      <stop offset="35%" stop-color="#58A6FF" />
      <stop offset="70%" stop-color="#238636" />
      <stop offset="100%" stop-color="#FF2A54" />
    </linearGradient>

    <!-- Radar Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="30%" stop-color="#00FFA3" />
      <stop offset="70%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF2A54" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 38px; fill: #58A6FF; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #8B949E; letter-spacing: 1.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #FFFFFF; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #7EE787; letter-spacing: 1px; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #C9D1D9; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="900" height="300" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Grid Accent Lines -->
  <line x1="10" y1="75" x2="910" y2="75" stroke="#21262D" stroke-width="1" />
  <line x1="10" y1="245" x2="910" y2="245" stroke="#21262D" stroke-width="1" />
  <line x1="610" y1="75" x2="610" y2="245" stroke="#21262D" stroke-width="1" />

  <!-- Top Status Bar -->
  <circle cx="35" cy="42" r="6" fill="#FF5F56" />
  <circle cx="55" cy="42" r="6" fill="#FFBD2E" />
  <circle cx="75" cy="42" r="6" fill="#27C93F" />
  <text x="105" y="47" class="mono" fill="#8B949E">auspify-internship // task-02 // systems-abstraction-benchmark</text>
  <text x="885" y="47" text-anchor="end" class="stat-label">STATUS: PRODUCTION-READY</text>

  <!-- Main Hero Title -->
  <text x="45" y="125" class="title">QUANTUM NUMBER GUESSER</text>
  <text x="45" y="152" class="subtitle">MULTI-TIER SYSTEMS ARCHITECTURE &amp; ABSTRACTION ODYSSEY</text>

  <!-- Heat Radar Visualizer -->
  <text x="45" y="190" class="mono" fill="#8B949E">HEAT RADAR PROXIMITY [ICE BLUE &#x2192; FIRE RED]:</text>
  <rect x="45" y="202" width="530" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1" />
  <rect x="47" y="204" width="460" height="10" rx="5" fill="url(#radarGrad)" filter="url(#glow)" />

  <!-- Right Telemetry Panel -->
  <text x="635" y="112" class="mono" fill="#58A6FF">&#x25B6; ARCHITECTURE TIERS</text>
  <text x="635" y="138" class="mono">&#x25AA; Tier 1: C# Managed (.NET 6 / WPF)</text>
  <text x="635" y="160" class="mono">&#x25AA; Tier 2: C++17 Systems (RAII / ImGui)</text>
  <text x="635" y="182" class="mono">&#x25AA; Tier 3: ANSI C99 (Manual Buffer CRT)</text>
  <text x="635" y="204" class="mono">&#x25AA; Tier 4: x86-64 Assembly (ISA / ALU)</text>
  <text x="635" y="226" class="mono">&#x25AA; Tier 6: Bare-Metal x86 BIOS &amp; RTL</text>

  <!-- Bottom Tier Badges -->
  <g transform="translate(45, 260)">
    <!-- Pill 1: C# -->
    <rect x="0" y="0" width="85" height="26" rx="6" fill="#1F6FEB" />
    <text x="42" y="17" text-anchor="middle" class="badge-text">C# WPF</text>

    <!-- Pill 2: C++ -->
    <rect x="95" y="0" width="85" height="26" rx="6" fill="#238636" />
    <text x="137" y="17" text-anchor="middle" class="badge-text">C++17</text>

    <!-- Pill 3: C -->
    <rect x="190" y="0" width="85" height="26" rx="6" fill="#30363D" />
    <text x="232" y="17" text-anchor="middle" class="badge-text">ANSI C</text>

    <!-- Pill 4: ASM -->
    <rect x="285" y="0" width="95" height="26" rx="6" fill="#8957E5" />
    <text x="332" y="17" text-anchor="middle" class="badge-text">x86-64 ASM</text>

    <!-- Pill 5: Machine -->
    <rect x="390" y="0" width="95" height="26" rx="6" fill="#D29922" />
    <text x="437" y="17" text-anchor="middle" class="badge-text">OPCODES</text>

    <!-- Pill 6: Bare Metal -->
    <rect x="495" y="0" width="115" height="26" rx="6" fill="#DA3633" />
    <text x="552" y="17" text-anchor="middle" class="badge-text">RING 0 BOOT</text>
  </g>

  <text x="885" y="278" text-anchor="end" class="mono" fill="#8B949E">Developed for Auspify Technologies</text>
</svg>
